name: MetaForge CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Build API
        run: npm run build --workspace=apps/api
        env:
          NODE_ENV: production

      - name: Build Studio
        run: npm run build --workspace=apps/studio
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_BASE_URL: https://metaforge-nou0.onrender.com/api/v1
          NEXTAUTH_URL: https://metaforge-gamma.vercel.app
          AUTH_SECRET: ci-build-secret-not-for-production
          NEXTAUTH_SECRET: ci-build-secret-not-for-production

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metaforge
          POSTGRES_PASSWORD: metaforge_test
          POSTGRES_DB: metaforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Setup Database
        run: |
          cd apps/api
          npx prisma db push
        env:
          DATABASE_URL: postgresql://metaforge:metaforge_test@localhost:5432/metaforge_test
          
      - name: Run E2E tests
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://metaforge:metaforge_test@localhost:5432/metaforge_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-secret-only
          NEXTAUTH_SECRET: test-secret-only
          NEXTAUTH_URL: http://localhost:3000
          API_URL: http://localhost:3001
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
          NODE_ENV: test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
