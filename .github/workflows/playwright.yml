name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metaforge
          POSTGRES_PASSWORD: metaforge_test
          POSTGRES_DB: metaforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Generate Prisma Client
      run: cd apps/api && npx prisma generate
    - name: Setup Database
      run: cd apps/api && npx prisma db push
      env:
        DATABASE_URL: postgresql://metaforge:metaforge_test@localhost:5432/metaforge_test
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        DATABASE_URL: postgresql://metaforge:metaforge_test@localhost:5432/metaforge_test
        REDIS_URL: redis://localhost:6379
        AUTH_SECRET: test-secret-only
        NEXTAUTH_SECRET: test-secret-only
        NEXTAUTH_URL: http://localhost:3000
        API_URL: http://localhost:3001
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
        NODE_ENV: test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
